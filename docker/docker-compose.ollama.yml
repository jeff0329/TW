services:
  ollama:
    image: ollama/ollama:latest
    container_name: taiwan-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: taiwan-app
    ports:
      - "5000:5000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
    depends_on:
      - ollama
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    restart: unless-stopped

volumes:
  ollama_data:
